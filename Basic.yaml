tags:
  bold:
    bold: true

  b-red:
    color: "#dc143c"
    bold: true

  dir:
    color: yellow

  b-yellow:
    color: yellow
    bold: true

  cyan:
    color: cyan

  lime:
    color: lime

  gale:
    color: black
    background: "#00dd00"

  fury:
    color: black
    background: "#ff9900"

  user-defined-split:
    background: orange
    split-type: User Defined

presets:
  npc:
    text: $(0)
    icon: npc

  run:
    text: 走る .dir([$(0)])

  wb:
    text: WB .dir([$(0)])

  _wb:
    square:
      text: 四角先WB .dir([$(0)])

    speed:
      text: WBS .dir([$(0)])

    hight:
      text: WBH .dir([$(0)])

    super:
      text: WB Super .dir([$(0)])

    midair:
      text: 空中WB .dir([$(0)])

  weapon:
    text: $(0)
    icon: weapon

  bow:
    text: $(0)
    icon: bow

  shield:
    text: $(0)
    icon: shield

  material:
    text: $(0) .dir($(1))
    icon: food

  cook:
    text: $(0)
    icon: cook

  chest:
    text: $(0)
    icon: chest

  _chest:
    special:
      text: $(0)
      icon: chest-special

  shop:
    text: $(0)
    icon: shop

  snap:
    text: 写真 - $(0)
    icon: snap

splits:
  - user-defined-split